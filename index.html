<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Volkarra Admin</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#C8541F">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="hark.css" />
    <style>
      :root {
        --x-bg: #F5F0E6; --x-bg2: #FFFFFF; --x-bg3: #EFE8DA; --x-bone: #1E1E1C; --x-dim: #6E6255;
        --x-sand: #A8461A; --x-olive: #5B6B3A; --x-olive2: #4A5830; --x-hueso: #F5F0E6; --x-line: #E3D9C6; --x-line2: #CDBFA5; --x-inb: #A39579;
        --x-orange: #D9622B; --x-orange2: #BF5222; --x-red: #B3261E; --x-red2: #8F1E18; --x-green: #3F6B2A; --x-amber: #8A5A00;
        --x-shadow: 0 1px 2px rgba(60,45,20,.06), 0 4px 14px rgba(60,45,20,.06);
        --x-ease: cubic-bezier(.2,.7,.2,1);
      }
      html, body { background: var(--x-bg); color: var(--x-bone); }
      body { font-family: var(--sans); font-size: 15px; line-height: 1.55; }
      .x-app { max-width: none; padding: 0 0 env(safe-area-inset-bottom); display: block; min-height: 100vh; background: var(--x-bg); color: var(--x-bone); }
      .x-app *, .x-app *::before, .x-app *::after { box-sizing: border-box; }
      .x-app a { color: inherit; }
      .x-app img { display: block; max-width: 100%; }
      .x-app button, .x-app input, .x-app select, .x-app textarea { font: inherit; color: inherit; }
      .x-app [hidden] { display: none !important; }
      .x-h { text-transform: uppercase; letter-spacing: .16em; font-weight: 600; font-size: clamp(20px, 4vw, 28px); line-height: 1.15; margin: 0 0 12px; }
      .x-muted { color: var(--x-dim); }
      .x-small { font-size: 13px; }

      .x-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; border: 1px solid var(--x-orange); background: var(--x-orange); color: var(--x-bone); text-transform: uppercase; letter-spacing: .16em; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; border-radius: 4px; transition: background .2s, border-color .2s, color .2s, opacity .2s; }
      .x-btn:hover:not(:disabled) { background: var(--x-orange2); border-color: var(--x-orange2); color: #fff; }
      .x-btn:disabled { opacity: .45; cursor: not-allowed; }
      .x-btn--ghost { background: #fff; border-color: var(--x-inb); color: var(--x-bone); }
      .x-btn--ghost:hover:not(:disabled) { background: var(--x-bg3); border-color: var(--x-sand); color: var(--x-bone); }
      .x-btn--sm { min-height: 44px; padding: 0 14px; font-size: 12px; letter-spacing: .12em; }
      .x-btn--block { width: 100%; }
      .x-btn--danger { background: var(--x-red); border-color: var(--x-red); color: #fff; }
      .x-btn--danger:hover:not(:disabled) { background: var(--x-red2); border-color: var(--x-red2); color: #fff; }
      .x-btn--olive { background: var(--x-olive); border-color: var(--x-olive); color: var(--x-hueso); }
      .x-btn--olive:hover:not(:disabled) { background: var(--x-olive2); border-color: var(--x-olive2); color: var(--x-hueso); }
      .x-icon { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: none; border: 1px solid var(--x-line2); cursor: pointer; color: var(--x-bone); position: relative; padding: 0; border-radius: 2px; }
      .x-icon:disabled { opacity: .35; cursor: not-allowed; }
      .x-link { color: var(--x-sand); text-decoration: underline; text-underline-offset: 3px; }
      .x-app :focus-visible { outline: 2px solid var(--x-sand); outline-offset: 2px; }

      .x-bar { position: sticky; top: 0; z-index: 40; background: var(--x-olive); color: var(--x-hueso); border-bottom: 1px solid var(--x-olive2); box-shadow: 0 1px 6px rgba(40,45,20,.18); }
      .x-bar__in { display: flex; align-items: center; gap: 12px; height: 60px; max-width: 1200px; margin: 0 auto; padding: 0 12px 0 16px; }
      .x-logo { display: flex; align-items: center; height: 44px; background: transparent; text-decoration: none; }
      .x-logo img { height: 40px; width: auto; mix-blend-mode: lighten; }
      .x-bar__tag { font-size: 12px; text-transform: uppercase; letter-spacing: .2em; color: var(--x-hueso); }
      .x-bar__r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
      .x-bar__who { font-size: 12px; color: var(--x-hueso); max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .x-bar .x-btn--ghost { background: transparent; color: var(--x-hueso); border-color: rgba(245,240,230,.6); }
      .x-bar .x-btn--ghost:hover:not(:disabled) { background: rgba(245,240,230,.14); border-color: var(--x-hueso); color: var(--x-hueso); }
      .x-bar :focus-visible { outline-color: var(--x-hueso); }
      @media (max-width: 640px) { .x-bar__tag, .x-bar__who { display: none; } .x-logo img { height: 32px; } }

      .x-form { display: grid; gap: 14px; }
      .x-row { display: flex; gap: 10px; flex-wrap: wrap; }
      .x-row > * { flex: 1 1 200px; }
      .x-field { display: grid; gap: 6px; }
      .x-field > span { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--x-dim); }
      .x-in { width: 100%; min-height: 48px; padding: 10px 14px; background: #fff; border: 1px solid var(--x-inb); border-radius: 4px; color: var(--x-bone); font-size: 16px; }
      .x-in::placeholder { color: #8A7E6E; opacity: 1; }
      .x-in:disabled { background: var(--x-bg3); }
      textarea.x-in { min-height: 96px; resize: vertical; }
      select.x-in { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--x-sand) 50%), linear-gradient(135deg, var(--x-sand) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
      .x-in:focus { border-color: var(--x-orange); outline: none; box-shadow: 0 0 0 3px rgba(217,98,43,.18); }
      input[type="color"].x-in { padding: 4px; min-height: 48px; cursor: pointer; }
      .x-msg { margin: 0; font-size: 14px; }
      .x-msg--ok { color: var(--x-green); }
      .x-msg--err { color: var(--x-red); }
      .x-check, .x-switch { display: flex; gap: 10px; align-items: center; min-height: 44px; cursor: pointer; font-size: 14px; color: var(--x-dim); }
      .x-check input, .x-switch input { width: 20px; height: 20px; accent-color: var(--x-olive); flex: 0 0 auto; }
      .x-panel { background: var(--x-bg2); border: 1px solid var(--x-line); padding: 20px; border-radius: 8px; box-shadow: var(--x-shadow); }
      .x-kpi, .x-item, .x-ord, .x-err, .x-scroll { border-radius: 8px; box-shadow: var(--x-shadow); }
      .x-panel h2 { margin: 0 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .18em; color: var(--x-sand); }
      .x-optlabel { font-size: 12px; text-transform: uppercase; letter-spacing: .16em; color: var(--x-dim); margin: 0 0 6px; }
      .x-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
      .x-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; min-width: 44px; justify-content: center; padding: 0 12px; border: 1px solid var(--x-line2); background: transparent; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; cursor: pointer; border-radius: 2px; color: var(--x-bone); }
      .x-chip[aria-pressed="true"] { border-color: var(--x-sand); background: #FBEDE4; color: var(--x-sand); font-weight: 600; }
      .x-sw { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(30,30,28,.25); }
      .x-err { padding: 28px; border: 1px solid var(--x-line); background: var(--x-bg2); text-align: center; }
      .x-pre { white-space: pre-wrap; background: var(--x-bg); border: 1px solid var(--x-line); padding: 16px; font-family: "Geist Mono", monospace; font-size: 13px; word-break: break-all; }

      /* login + mfa */
      .x-login { max-width: 420px; margin: 40px auto; padding: 0 20px 60px; display: grid; gap: 16px; }
      .x-login .x-logo { justify-content: center; height: auto; background: var(--x-olive); border-radius: 8px; padding: 14px; box-shadow: var(--x-shadow); }
      .x-login .x-logo img { height: 84px; }
      .x-login h1 { margin: 0; text-align: center; font-size: 17px; text-transform: uppercase; letter-spacing: .18em; font-weight: 600; }
      .x-code { font-family: "Geist Mono", monospace; font-size: 24px; letter-spacing: .4em; text-align: center; }
      .x-qr { background: #fff; padding: 12px; width: 220px; height: 220px; justify-self: center; border: 1px solid var(--x-line); }
      .x-qr img { width: 100%; height: 100%; }

      /* panel */
      .x-adm { display: grid; min-height: calc(100vh - 60px); }
      @media (min-width: 900px) { .x-adm { grid-template-columns: 220px 1fr; } }
      .x-side { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; overflow-x: auto; background: var(--x-olive); border-top: 1px solid var(--x-olive2); padding-bottom: env(safe-area-inset-bottom); }
      .x-side button { flex: 1 0 auto; min-height: 56px; padding: 0 12px; background: none; border: 0; border-top: 3px solid transparent; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--x-hueso); cursor: pointer; }
      .x-side button:hover { background: rgba(245,240,230,.12); }
      .x-side button[aria-current="page"] { color: var(--x-olive2); background: var(--x-hueso); border-top-color: var(--x-orange); font-weight: 600; }
      .x-side :focus-visible { outline-color: var(--x-hueso); outline-offset: -3px; }
      .x-side button[aria-current="page"]:focus-visible { outline-color: var(--x-olive2); }
      @media (min-width: 900px) {
        .x-side { position: sticky; top: 60px; height: calc(100vh - 60px); flex-direction: column; border-top: 0; border-right: 1px solid var(--x-olive2); padding: 16px 0; }
        .x-side button { flex: 0 0 auto; text-align: left; padding: 0 20px; border-top: 0; border-left: 3px solid transparent; min-height: 48px; }
        .x-side button[aria-current="page"] { border-left-color: var(--x-orange); }
      }
      .x-main { padding: 24px 16px 110px; min-width: 0; }
      @media (min-width: 900px) { .x-main { padding: 32px 32px 64px; } }
      .x-adhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
      .x-adhead h1 { margin: 0; font-size: 18px; text-transform: uppercase; letter-spacing: .18em; }
      .x-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
      .x-tools .x-in { flex: 1 1 220px; }
      .x-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
      .x-kpi { background: var(--x-bg2); border: 1px solid var(--x-line); padding: 16px; }
      .x-kpi b { display: block; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .x-kpi span { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--x-dim); }
      .x-list { display: grid; gap: 8px; }
      .x-item { background: var(--x-bg2); border: 1px solid var(--x-line); padding: 12px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
      .x-item img { width: 56px; height: 70px; object-fit: cover; background: var(--x-bg3); }
      .x-item h3 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; }
      .x-item p { margin: 2px 0 0; font-size: 13px; color: var(--x-dim); }
      .x-item__act { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      @media (min-width: 700px) { .x-item { grid-template-columns: auto 1fr auto; } .x-item__act { grid-column: auto; } }
      .x-badge { display: inline-block; margin-left: 8px; padding: 2px 8px; border: 1px solid var(--x-sand); color: var(--x-sand); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; vertical-align: middle; }
      .x-vgrid { overflow-x: auto; border: 1px solid var(--x-line); }
      .x-vgrid table { border-collapse: collapse; width: 100%; }
      .x-vgrid th, .x-vgrid td { padding: 6px; border-bottom: 1px solid var(--x-line); text-align: left; }
      .x-vgrid th { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--x-dim); white-space: nowrap; }
      .x-vgrid tr:last-child > * { border-bottom: 0; }
      .x-vgrid .x-in { min-width: 64px; text-align: center; padding-left: 6px; padding-right: 6px; }
      .x-vtot { margin: 8px 0 0; font-size: 14px; color: var(--x-dim); }
      .x-vtot b { color: var(--x-sand); font-variant-numeric: tabular-nums; }
      .x-ord { background: var(--x-bg2); border: 1px solid var(--x-line); }
      .x-ord summary { list-style: none; cursor: pointer; padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; min-height: 56px; }
      .x-ord summary::-webkit-details-marker { display: none; }
      .x-ord summary b { letter-spacing: .08em; }
      .x-ord summary small { color: var(--x-dim); font-size: 13px; }
      .x-ord__body { border-top: 1px solid var(--x-line); padding: 14px; display: grid; gap: 12px; font-size: 14px; }
      .x-dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin: 0; }
      .x-dl dt { color: var(--x-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; padding-top: 2px; }
      .x-dl dd { margin: 0; word-break: break-word; }
      .x-sumrow { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--x-line); }
      .x-sumrow:last-child { border: 0; font-weight: 600; }
      .x-st { font-size: 12px; padding: 3px 8px; border: 1px solid var(--x-line2); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; align-self: start; border-radius: 999px; font-weight: 600; background: var(--x-bg3); color: var(--x-bone); }
      .x-st--Pagado, .x-st--Enviado { color: #2F5A1E; background: #EAF0DD; border-color: #B9C99A; }
      .x-st--Entregado { color: #fff; background: var(--x-green); border-color: var(--x-green); }
      .x-st--Cancelado { color: var(--x-red); background: #FBE9E7; border-color: #E8B4AE; }
      .x-st--Pendiente { color: var(--x-amber); background: #FBF1D9; border-color: #E6CF95; }
      .x-st--Archivado { color: var(--x-dim); background: var(--x-bg3); border-color: var(--x-line2); }
      .x-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
      .x-tbl th, .x-tbl td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--x-line); vertical-align: top; }
      .x-tbl th { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--x-dim); font-weight: 500; }
      .x-scroll { overflow-x: auto; border: 1px solid var(--x-line); background: var(--x-bg2); }
      .x-tbl tbody tr:nth-child(even) { background: #FBF8F2; }

      /* galería */
      .x-gal { display: flex; flex-wrap: wrap; gap: 10px; }
      .x-gal__it { width: 104px; border: 1px solid var(--x-line2); background: var(--x-bg); padding: 4px; display: grid; gap: 4px; }
      .x-gal__it img { width: 100%; height: 118px; object-fit: cover; background: var(--x-bg3); }
      .x-gal__it.is-main { border-color: var(--x-sand); }
      .x-gal__ctl { display: flex; gap: 2px; }
      .x-gal__ctl button { flex: 1; min-height: 36px; background: none; border: 1px solid var(--x-line2); color: var(--x-bone); cursor: pointer; font-size: 13px; padding: 0; }
      .x-gal__ctl button:disabled { opacity: .3; cursor: not-allowed; }
      .x-gal__ctl button.is-del { color: var(--x-red); border-color: var(--x-red); }
      .x-gal__tag { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--x-sand); text-align: center; min-height: 15px; }

      /* personalizar */
      .x-cols { display: grid; gap: 14px; }
      @media (min-width: 720px) { .x-cols { grid-template-columns: 1fr 1fr; } }
      .x-mini { border: 1px solid var(--x-line2); overflow: hidden; }
      .x-mini__ann { padding: 8px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; text-align: center; }
      .x-mini__hero { padding: 28px 16px; display: grid; gap: 8px; justify-items: start; }
      .x-mini__hero h3 { margin: 0; font-size: 20px; text-transform: uppercase; letter-spacing: .12em; }
      .x-mini__hero p { margin: 0; font-size: 14px; opacity: .85; }
      .x-mini__hero span { display: inline-flex; align-items: center; min-height: 40px; padding: 0 18px; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; }
      .x-mini__logo { max-height: 44px; width: auto; }
      .x-mini__foot { padding: 10px 12px; font-size: 12px; border-top: 1px solid rgba(255,255,255,.12); opacity: .8; }
      .x-blk { border: 1px solid var(--x-line2); background: var(--x-bg); padding: 12px; display: grid; gap: 10px; }
      .x-blk__top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .x-blk__top b { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
      .x-blk__top .x-blk__sp { margin-left: auto; display: flex; gap: 4px; }
      .x-blk img.x-thumb { width: 120px; height: 72px; object-fit: cover; background: var(--x-bg3); border: 1px solid var(--x-line); }
      .x-mods { display: grid; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

      .x-tabn { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 8px; border-radius: 10px; background: var(--x-orange); color: var(--x-bone); font-size: 11px; font-weight: 600; letter-spacing: 0; vertical-align: middle; }
      .x-stars { color: var(--x-sand); letter-spacing: .12em; }
      .x-rv__ph { width: 56px; height: 70px; background: var(--x-bg3); border: 1px solid var(--x-line); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; color: var(--x-dim); }
      .x-item p.x-rv__c { color: var(--x-bone); white-space: pre-wrap; margin-top: 6px; font-size: 14px; }
      .x-prog { width: 100%; max-width: 420px; height: 8px; accent-color: var(--x-olive); }
      .x-vid { width: 100%; max-width: 420px; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--x-line); }
      .x-price { margin: 0; font-size: 14px; color: var(--x-dim); }
      .x-price b { color: var(--x-sand); }
      .x-btnlink { background: none; border: 0; padding: 0; min-height: 44px; cursor: pointer; font-size: inherit; }

      /* modal */
      .x-scrim { position: fixed; inset: 0; background: rgba(30,30,28,.45); z-index: 60; opacity: 0; transition: opacity .25s; }
      .x-scrim.is-on { opacity: 1; }
      .x-modal { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
      .x-modal__box { pointer-events: auto; background: var(--x-bg); border: 1px solid var(--x-line); border-radius: 10px 10px 0 0; box-shadow: 0 12px 40px rgba(40,30,15,.22); width: min(760px, 100%); max-height: 92vh; overflow: auto; position: relative; transform: translateY(24px); opacity: 0; transition: transform .3s var(--x-ease), opacity .3s; }
      .x-modal.is-on .x-modal__box { transform: none; opacity: 1; }
      @media (min-width: 760px) { .x-modal { align-items: center; padding: 24px; } .x-modal__box { border-radius: 10px; } }
      .x-modal__close { position: absolute; top: 6px; right: 6px; z-index: 2; background: #fff; }
      .x-toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 90; background: var(--x-bone); color: var(--x-hueso); padding: 12px 18px; font-size: 14px; max-width: calc(100% - 32px); border-radius: 8px; border-left: 4px solid var(--x-orange); box-shadow: 0 8px 24px rgba(40,30,15,.25); }
      .x-toast--ok { border-left-color: #9FB46A; }
      .x-toast--err { background: var(--x-red); color: #fff; border-left-color: var(--x-red2); }
      .x-seg { display: inline-flex; border: 1px solid var(--x-inb); border-radius: 6px; overflow: hidden; background: #fff; flex: 0 0 auto; }
      .x-seg button { min-height: 44px; padding: 0 16px; border: 0; background: transparent; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; color: var(--x-bone); cursor: pointer; }
      .x-seg button + button { border-left: 1px solid var(--x-inb); }
      .x-seg button[aria-pressed="true"] { background: var(--x-olive); color: var(--x-hueso); }
      .x-seg button span { font-weight: 400; margin-left: 6px; }
      .x-ord__act { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; border-top: 1px solid var(--x-line); }

const mbText = (bytes) => (bytes / MB).toFixed(1).replace('.', ',') + ' MB';
function checkImage(file) {
  if (!IMG_TYPES.includes(file.type)) throw new Error('Formato no permitido: usa JPG, PNG o WebP.');
}
function checkImageSize(blob) {
  if (!blob) throw new Error('No se pudo comprimir la imagen.');
  if (blob.size > MAX_IMG_BYTES) throw new Error('La imagen comprimida pesa ' + mbText(blob.size) + '. El máximo es 5 MB.');
}
async function resizeImg(file, max) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo leer la imagen.')); i.src = url; });
    const k = Math.min(1, (max || 1600) / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, c.width, c.height);
    // webp primero, si no hay soporte jpeg
    const wb = await new Promise((res) => c.toBlob(res, 'image/webp', 0.82));
    if (wb && wb.type === 'image/webp') return wb;
    ctx.globalCompositeOperation = 'destination-over'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}
const IMG_EXT = { 'image/webp': '.webp', 'image/jpeg': '.jpg', 'image/png': '.png', 'image/gif': '.gif', 'image/svg+xml': '.svg' };
async function uploadImg(file, folder, prefix) {
  // gif/svg van tal cual
  const raw = file.type === 'image/gif' || file.type === 'image/svg+xml';
  if (!raw) checkImage(file);
  // comprimir antes de subir
  let blob = raw ? file : await resizeImg(file, 1600);
  // si sale más pesado, subir el original
  if (blob && blob.size > file.size) blob = file;
  checkImageSize(blob);
  const type = blob.type || file.type || 'image/jpeg';
  const path = (folder ? folder.replace(/\/$/, '') + '/' : '') + (prefix || '') + randomId() + (IMG_EXT[type] || '.jpg');
  const r = await sb.storage.from('products').upload(path, blob, { cacheControl: '2592000', contentType: type, upsert: true });
  if (r.error) throw new Error('No se pudo subir la imagen: ' + errText(r.error));
  return PUB + path;
}
// con onProg va por xhr para tener progreso
async function putFile(path, blob, type, onProg) {
  if (onProg && window.XMLHttpRequest) {
    let tok = null;
    try { const s = await sb.auth.getSession(); tok = s.data && s.data.session && s.data.session.access_token; } catch (e) { tok = null; }
    if (tok) {
      try {
        await new Promise((res, rej) => {
          const x = new XMLHttpRequest();
          x.open('POST', SB_URL + '/storage/v1/object/products/' + path.split('/').map(encodeURIComponent).join('/'));
          x.setRequestHeader('Authorization', 'Bearer ' + tok);
          x.setRequestHeader('apikey', SB_KEY);
          x.setRequestHeader('x-upsert', 'true');
          x.setRequestHeader('Content-Type', type);
          x.setRequestHeader('cache-control', 'max-age=2592000');
          x.upload.onprogress = (e) => { if (e.lengthComputable) onProg(e.loaded / e.total); };
          x.onload = () => {
            if (x.status >= 200 && x.status < 300) return res();
            let m = ''; try { const j = JSON.parse(x.responseText); m = j.message || j.error || ''; } catch (e) { m = x.responseText; }
            const err = new Error(x.status === 413 || /size|large/i.test(m) ? 'El archivo supera el tamaño permitido por el almacenamiento.' : errText({ message: m || 'Error ' + x.status }));
            err.http = true; rej(err);
          };
          x.onerror = () => rej(new Error('net'));
          x.send(blob);
        });
        onProg(1);
        return PUB + path;
      } catch (e) { if (e.http) throw new Error('No se pudo subir: ' + e.message); }
    }
  }
  const r = await sb.storage.from('products').upload(path, blob, { cacheControl: '2592000', contentType: type, upsert: true });
  if (r.error) throw new Error('No se pudo subir: ' + errText(r.error));
  if (onProg) onProg(1);
  return PUB + path;
}

    clearInterval(S.lockTimer);

async function startMfa() {
  const { data, error } = await sb.auth.mfa.listFactors();
  if (error) throw new Error(errText(error));
  const all = (data && (data.all || [])) || [];
  const totp = all.filter((f) => f.factor_type === 'totp');
  const verified = totp.find((f) => f.status === 'verified');
  if (verified) { S.factor = verified.id; S.step = 'mfa'; render(); return; }
  for (const f of totp) { try { await sb.auth.mfa.unenroll({ factorId: f.id }); } catch (e) {} }
  const en = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Volkarra Admin' });
  if (en.error) throw new Error(errText(en.error));
  S.enroll = en.data; S.factor = en.data.id; S.step = 'enroll'; render();
}

          h('button', { type: 'button', 'aria-label': 'Mover a la derecha', text: '→', disabled: i === imgs.length - 1, onclick: () => move(i, 1) }),
          h('button', { type: 'button', class: 'is-del', 'aria-label': 'Quitar foto ' + (i + 1), text: '✕', onclick: () => { imgs.splice(i, 1); draw(); } })),
        i > 0 ? h('button', { type: 'button', class: 'x-btn x-btn--ghost', style: 'min-height:36px;padding:0 4px;font-size:11px;letter-spacing:.06em', text: 'Principal', onclick: () => { const [x] = imgs.splice(i, 1); imgs.unshift(x); draw(); } }) : null));

    const pubRows = rows.filter((r) => r.approved);
    const avg = pubRows.length ? (pubRows.reduce((a, r) => a + (Number(r.rating) || 0), 0) / pubRows.length).toFixed(1).replace('.', ',') : '—';
    S.pendingReviews = pend; updTabBadge();
    kp.textContent = '';
    kp.append(kpi(pend, 'Pendientes'), kpi(pub, 'Publicadas'), kpi(avg, 'Nota promedio publicadas'));
    const f = S.revFilter || 'pend';
    chips.textContent = '';
    [['pend', 'Pendientes (' + pend + ')'], ['pub', 'Publicadas (' + pub + ')'], ['all', 'Todas (' + rows.length + ')']].forEach(([k, l]) =>
      chips.append(h('button', { type: 'button', class: 'x-chip', 'aria-pressed': String(f === k), text: l, onclick: () => { S.revFilter = k; draw(); } })));
    const shown = rows.filter((r) => (f === 'all' ? true : f === 'pub' ? !!r.approved : !r.approved))
      .sort((a, b) => (a.approved ? 1 : 0) - (b.approved ? 1 : 0) || new Date(b.created_at) - new Date(a.created_at));
    list.textContent = '';
    if (!shown.length) list.append(h('p', { class: 'x-muted', text: f === 'pend' ? 'No hay reseñas pendientes.' : f === 'pub' ? 'Aún no hay reseñas publicadas.' : 'Aún no hay reseñas.' }));
    shown.forEach((r) => {
      const photo = safeUrl(r.photo_url);
      const thumb = photo
        ? h('a', { href: photo, target: '_blank', rel: 'noopener noreferrer', 'aria-label': 'Ver foto de ' + (r.name || 'cliente') }, h('img', { src: photo, alt: 'Foto de la reseña', loading: 'lazy' }))
        : h('div', { class: 'x-rv__ph', text: 'Sin foto' });
      list.append(h('div', { class: 'x-item' }, thumb,
        h('div', null,
          h('h3', null, pname(r.product_id), h('span', { class: 'x-badge', text: r.approved ? 'Publicada' : 'Pendiente' })),
          h('p', null, stars(r.rating), ' · ' + (r.name || 'Anónimo') + ' · ' + fdate(r.created_at)),
          r.comment ? h('p', { class: 'x-rv__c', text: r.comment }) : null),
        h('div', { class: 'x-item__act' },
          !r.approved ? h('button', { type: 'button', class: 'x-btn x-btn--sm', text: 'Aprobar', onclick: act(() => setApproved(r, true), 'Reseña publicada') }) : null,
          r.approved ? h('button', { type: 'button', class: 'x-btn x-btn--ghost x-btn--sm', text: 'Ocultar', onclick: act(() => setApproved(r, false), 'Reseña oculta') }) : null,
          h('button', { type: 'button', class: 'x-btn x-btn--danger x-btn--sm', text: 'Eliminar', onclick: async (e) => {
            if (!confirm('¿Eliminar la reseña de ' + (r.name || 'este cliente') + '? No se puede deshacer.')) return;
            await act(async () => { const d = await q(sb.from('reviews').delete().eq('id', r.id).select('id')); if (!d || !d.length) throw new Error('No se pudo eliminar: sin permiso.'); rows.splice(rows.indexOf(r), 1); }, 'Reseña eliminada')(e);
          } }))));
    });
  }
  body.textContent = '';
  body.append(kp, h('div', { class: 'x-tools' }, chips), list,
    h('p', { class: 'x-muted x-small', style: 'margin-top:16px', text: 'Solo las reseñas aprobadas se muestran en la tienda. Ocultar la devuelve a pendientes.' }));
  draw();
}

async function tabMarketing(body) {
  const [s, prods] = await Promise.all([loadSettings(), q(sb.from('products').select('id,name,price,active,sort').order('sort', { ascending: true }))]);
  const ex = isObj(s.extras) ? s.extras : {};
  const products = prods || [];
  const pById = (id) => products.find((p) => String(p.id) === String(id));

  const thr = numIn(ex.free_shipping_threshold, { min: 0, placeholder: 'Vacío = desactivado' });
  const ship = numIn(s.shipping_cost == null ? 0 : s.shipping_cost, { min: 0 });
  const curShip = h('b', { text: clp(s.shipping_cost) });
  const shipForm = actForm([
    h('div', { class: 'x-cols' },
      field('Envío gratis desde ($)', thr, 'Déjalo vacío para no ofrecer envío gratis.'),
      field('Costo de envío a domicilio ($)', ship, '0 = por pagar al recibir. Es el mismo valor de Ajustes.')),
    h('p', { class: 'x-muted x-small', style: 'margin:0' }, 'Solo se muestra si el costo de envío es mayor a $0. Costo actual: ', curShip, ' · ',

  ], async () => {

    if (c !== Number(s.shipping_cost || 0)) { await saveSettings({ shipping_cost: c }); s.shipping_cost = c; curShip.textContent = clp(c); }
    await saveExtras({ free_shipping_threshold: t });
    return t != null && c === 0 ? 'Guardado. Ojo: con envío $0 no se muestra el envío gratis.' : 'Envío guardado';
  });

  const w = Object.assign({ enabled: false, percent: 10, code: '' }, isObj(ex.welcome) ? ex.welcome : {});
  const wOn = h('input', { type: 'checkbox', role: 'switch', checked: !!w.enabled });
  const wPct = numIn(w.percent, { min: 1, max: 50 });
  const wCode = h('input', { class: 'x-in', value: w.code || '', maxlength: 30, autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', style: 'font-family:"Geist Mono",monospace;text-transform:uppercase', placeholder: 'BIENVENIDA10' });
  const welcomeForm = actForm([
    h('label', { class: 'x-switch' }, wOn, 'Activar cupón de bienvenida'),
    h('div', { class: 'x-cols' }, field('Porcentaje de descuento (1–50)', wPct), field('Código', wCode, 'Letras, números, guion. Sin espacios.')),
  ], async () => {
    const pct = optInt(wPct.value, 'Porcentaje', 1, 50);
    if (pct == null) throw new Error('Porcentaje: escribe un número entre 1 y 50.');
    const code = wCode.value.trim().toUpperCase().replace(/\s+/g, '');
    if (wOn.checked && !code) throw new Error('Escribe el código del cupón.');
    if (code && !/^[A-Z0-9_-]{3,30}$/.test(code)) throw new Error('El código usa solo letras, números, guion o guion bajo (3 a 30).');
    wCode.value = code;
    await saveExtras({ welcome: { enabled: wOn.checked, percent: pct, code } });
    return wOn.checked ? 'Cupón activo: ' + code + ' (' + pct + '%)' : 'Cupón desactivado';
  });

  const waOn = h('input', { type: 'checkbox', role: 'switch', checked: ex.whatsapp_float !== false });
  const ig = h('input', { class: 'x-in', value: ex.instagram || '', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: 'mathy_adventure' });
  const socialForm = actForm([
    h('label', { class: 'x-switch' }, waOn, 'Mostrar botón flotante de WhatsApp'),
    s.whatsapp ? h('p', { class: 'x-muted x-small', style: 'margin:-8px 0 0', text: 'Usa el número de Ajustes: +' + s.whatsapp }) : h('p', { class: 'x-msg x-msg--err x-small', style: 'margin:-8px 0 0' }, 'Falta el número de WhatsApp. ', h('button', { type: 'button', class: 'x-link x-btnlink', text: 'Agrégalo en Ajustes', onclick: () => goTab('ajustes') })),
    field('Instagram (usuario sin @)', ig),
  ], async () => {
    const u = ig.value.trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/[/?#].*$/, '').replace(/^@+/, '');
    if (u && !/^[A-Za-z0-9._]{1,30}$/.test(u)) throw new Error('Instagram: usa solo letras, números, punto o guion bajo.');
    ig.value = u;
    await saveExtras({ whatsapp_float: waOn.checked, instagram: u || null });
    return 'Redes guardadas';
  });

  let heroVideo = ex.hero_video || null;
  const vidBox = h('div', { style: 'display:grid;gap:8px' });
  const vNote = h('p', { class: 'x-msg x-small', role: 'status' });
  const prog = h('progress', { class: 'x-prog', max: 100, value: 0, hidden: true, 'aria-label': 'Progreso de subida' });
  const vFile = h('input', { type: 'file', accept: 'video/mp4,video/webm,.mp4,.webm', class: 'x-in', style: 'padding:10px;max-width:420px', 'aria-label': 'Subir video de portada' });
  const rmBtn = h('button', { type: 'button', class: 'x-btn x-btn--danger x-btn--sm', style: 'justify-self:start', text: 'Quitar video' });
  const drawVid = () => {
    vidBox.textContent = '';
    const src = safeUrl(heroVideo);
    if (src) vidBox.append(h('video', { class: 'x-vid', src, controls: true, muted: true, playsinline: true, preload: 'metadata' }), h('a', { class: 'x-link x-small', href: src, target: '_blank', rel: 'noopener noreferrer', text: 'Abrir video' }));
    else vidBox.append(h('p', { class: 'x-muted x-small', style: 'margin:0', text: 'Sin video. La portada usa la imagen.' }));
    rmBtn.hidden = !heroVideo;
  };
  vFile.addEventListener('change', async () => {
    const f = vFile.files && vFile.files[0]; if (!f) return;
    const type = f.type || (/\.webm$/i.test(f.name) ? 'video/webm' : /\.mp4$/i.test(f.name) ? 'video/mp4' : '');
    if (!VIDEO_TYPES[type]) { setNote(vNote, 'Usa un video MP4 o WebM.', 'err'); vFile.value = ''; return; }
    if (f.size > MAX_VIDEO_BYTES) { setNote(vNote, 'El video pesa ' + mbText(f.size) + '. El máximo es 40 MB.', 'err'); vFile.value = ''; return; }
    // aviso si pesa más de 8 mb
    if (f.size > 8 * MB) {
      const go = await confirmDlg({ title: 'Video pesado', msg: 'Los videos pesan mucho y gastan el tráfico gratis. Mejor súbelo a Instagram/YouTube o comprímelo bajo 8 MB.', ok: 'Continuar' });
      if (!go) { vFile.value = ''; return; }
    }
    vFile.disabled = true; rmBtn.disabled = true; prog.hidden = false; prog.value = 0;
    setNote(vNote, 'Subiendo video…');
    try {
      const path = 'site/hero-video-' + randomId() + VIDEO_TYPES[type];
      const url = await putFile(path, f, type, (r) => { const pc = Math.round(r * 100); prog.value = pc; setNote(vNote, 'Subiendo video… ' + pc + '%'); });
      setNote(vNote, 'Guardando…');
      await saveExtras({ hero_video: url });
      heroVideo = url; drawVid(); setNote(vNote, 'Video subido y guardado.', 'ok');
    } catch (e) { setNote(vNote, e.message, 'err'); }
    prog.hidden = true; vFile.disabled = false; rmBtn.disabled = false; vFile.value = '';
  });
  rmBtn.addEventListener('click', async () => {
    if (!confirm('¿Quitar el video de portada?')) return;
    rmBtn.disabled = true;
    try { await saveExtras({ hero_video: null }); heroVideo = null; drawVid(); setNote(vNote, 'Video quitado.', 'ok'); }
    catch (e) { setNote(vNote, e.message, 'err'); }
    rmBtn.disabled = false;
  });
  drawVid();

  const look = arr(ex.lookbook).filter(isObj).map((it) => Object.assign({}, it));
  const lbList = h('div', { style: 'display:grid;gap:10px' });
  const lbNote = h('p', { class: 'x-msg x-small', role: 'status' });
  const lbFile = h('input', { type: 'file', accept: IMG_TYPES.join(','), multiple: true, class: 'x-in', style: 'padding:10px', 'aria-label': 'Agregar fotos al lookbook' });
  const prodSelect = (it, empty) => {
    const sel = h('select', { class: 'x-in' }, h('option', { value: '', text: empty }), products.map((p) => h('option', { value: String(p.id), text: p.name + (p.active ? '' : ' (oculto)'), selected: it.product_id != null && String(it.product_id) === String(p.id) })));
    sel.addEventListener('change', () => { const p = pById(sel.value); it.product_id = p ? p.id : null; });
    return sel;
  };
  const drawLb = () => {
    lbList.textContent = '';
    if (!look.length) lbList.append(h('p', { class: 'x-muted x-small', style: 'margin:0', text: 'Sin fotos propias todavía.' }));
    look.forEach((it, i) => {
      const mv = (d) => { const j = i + d; if (j < 0 || j >= look.length) return; [look[i], look[j]] = [look[j], look[i]]; drawLb(); };
      lbList.append(h('div', { class: 'x-blk' },
        h('div', { class: 'x-blk__top' }, h('b', { text: 'Foto ' + (i + 1) }),
          h('span', { class: 'x-blk__sp' },
            iconBtn('Subir', '↑', i === 0, () => mv(-1)),
            iconBtn('Bajar', '↓', i === look.length - 1, () => mv(1)),
            iconBtn('Eliminar foto ' + (i + 1), '✕', false, () => { if (confirm('¿Quitar esta foto del lookbook?')) { look.splice(i, 1); drawLb(); } }, true))),
        h('div', { style: 'display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap' },
          h('img', { class: 'x-thumb', src: safeUrl(it.image) || BASE + '/logo-v.jpg', alt: it.caption || 'Foto ' + (i + 1) + ' del lookbook', loading: 'lazy' }),
          h('div', { style: 'flex:1 1 240px;display:grid;gap:10px' },
            field('Texto', tIn(it, 'caption', { placeholder: 'Ej. Volcán Villarrica, invierno' })),
            field('Producto', prodSelect(it, 'Sin producto'))))));
    });
  };
  let lbForm;
  lbFile.addEventListener('change', async () => {
    const files = Array.from(lbFile.files || []); if (!files.length) return;
    lbForm.dataset.uploading = '1'; lbFile.disabled = true;
    let ok = 0, fail = 0, why = '';
    for (let k = 0; k < files.length; k++) {
      setNote(lbNote, 'Subiendo foto ' + (k + 1) + ' de ' + files.length + '…');
      try {
        const url = await uploadImg(files[k], 'site', 'lookbook-');
        look.push({ image: url, caption: '', product_id: null }); ok++; drawLb();
      } catch (e) { fail++; why = e.message.replace(/\.$/, ''); }
    }
    delete lbForm.dataset.uploading; lbFile.disabled = false; lbFile.value = '';
    setNote(lbNote, (ok ? ok + (ok === 1 ? ' foto subida.' : ' fotos subidas.') + ' Agrega texto y producto, y guarda.' : '') + (fail ? ' ' + fail + ' no se pudieron subir (' + why + ').' : ''), fail ? 'err' : 'ok');
  });
  lbForm = actForm([lbList, h('div', { class: 'x-field' }, h('span', { text: 'Agregar fotos (se comprimen a 1600 px)' }), lbFile, lbNote)], async () => {
    if (look.some((it) => !it.image)) throw new Error('Cada foto del lookbook necesita una imagen.');
    const out = look.map((it) => Object.assign({}, it, { caption: String(it.caption || '').trim(), product_id: it.product_id == null ? null : it.product_id }));

  });
  drawLb();

  const bundles = arr(ex.bundles).filter(isObj).map((b) => Object.assign({}, b, { product_ids: (Array.isArray(b.product_ids) ? b.product_ids : []).filter((id) => pById(id)).map((id) => pById(id).id) }));
  const pkList = h('div', { style: 'display:grid;gap:10px' });
  const priceLine = (b, el) => {
    el.textContent = '';
    const ps = b.product_ids.map(pById).filter(Boolean);
    if (ps.length < 2) { el.append('Elige 2 o más productos para ver el precio.'); return; }
    const normal = ps.reduce((a, p) => a + (Number(p.price) || 0), 0);
    const pct = Math.max(0, Math.min(50, Math.round(Number(b.percent) || 0)));
    const pack = Math.round(normal * (100 - pct) / 100);
    el.append('Precio normal ', h('s', { text: clp(normal) }), ' · Precio pack ', h('b', { text: clp(pack) }), ' · Ahorro ' + clp(normal - pack));
  };
  const drawPk = () => {
    pkList.textContent = '';
    if (!bundles.length) pkList.append(h('p', { class: 'x-muted x-small', style: 'margin:0', text: 'Aún no hay packs.' }));
    bundles.forEach((b, i) => {
      const price = h('p', { class: 'x-price', 'aria-live': 'polite' });
      const on = h('input', { type: 'checkbox', checked: b.active !== false });
      on.addEventListener('change', () => { b.active = on.checked; });
      const pct = numIn(b.percent, { min: 1, max: 50 });
      pct.addEventListener('input', () => { b.percent = pct.value === '' ? '' : Number(pct.value); priceLine(b, price); });
      const chipsBox = h('div', { class: 'x-chips' }, products.map((p) => {
        const sel = () => b.product_ids.some((id) => String(id) === String(p.id));
        const c = h('button', { type: 'button', class: 'x-chip', 'aria-pressed': String(sel()), onclick: () => {
          b.product_ids = sel() ? b.product_ids.filter((id) => String(id) !== String(p.id)) : b.product_ids.concat(p.id);
          c.setAttribute('aria-pressed', String(sel())); priceLine(b, price);
        } }, p.name + ' · ' + clp(p.price) + (p.active ? '' : ' (oculto)'));
        return c;
      }));
      const title = h('b', { text: (i + 1) + '. ' + (b.name || 'Pack sin nombre') });
      const nameIn = tIn(b, 'name', { placeholder: 'Ej. Pack Volcán' });
      nameIn.addEventListener('input', () => { title.textContent = (i + 1) + '. ' + (b.name || 'Pack sin nombre'); });
      pkList.append(h('div', { class: 'x-blk' },
        h('div', { class: 'x-blk__top' }, title, h('label', { class: 'x-switch' }, on, 'Activo'),
          h('span', { class: 'x-blk__sp' }, iconBtn('Eliminar pack ' + (i + 1), '✕', false, () => { if (confirm('¿Eliminar el pack “' + (b.name || 'sin nombre') + '”?')) { bundles.splice(i, 1); drawPk(); } }, true))),
        h('div', { class: 'x-cols' }, field('Nombre', nameIn), field('Descuento del pack (%)', pct)),
        h('div', { class: 'x-field' }, h('span', { text: 'Productos (2 o más)' }), chipsBox),
        price));
      priceLine(b, price);
    });
  };
  const pkForm = actForm([pkList, h('button', { type: 'button', class: 'x-btn x-btn--ghost x-btn--sm', style: 'justify-self:start', text: '+ Agregar pack', onclick: () => { bundles.push({ id: 'pack-' + Date.now().toString(36), name: '', product_ids: [], percent: 10, active: true }); drawPk(); } })], async () => {
    const out = bundles.map((b, i) => {
      const name = String(b.name || '').trim();
      if (!name) throw new Error('El pack ' + (i + 1) + ' necesita un nombre.');
      if (b.product_ids.length < 2) throw new Error('“' + name + '” necesita 2 o más productos.');
      const pct = optInt(b.percent, 'Descuento de “' + name + '”', 1, 50);
      if (pct == null) throw new Error('Descuento de “' + name + '”: escribe un número entre 1 y 50.');
      return Object.assign({}, b, { id: b.id || 'pack-' + Date.now().toString(36) + i, name, product_ids: b.product_ids.slice(), percent: pct, active: b.active !== false });
    });
    await saveExtras({ bundles: out });
    return 'Packs guardados';
  });
  drawPk();

  body.textContent = '';
  body.append(
    section('Envío gratis', 'Monto mínimo de compra para no cobrar envío.', shipForm),
    section('Cupón de bienvenida', 'Se ofrece a clientes nuevos en la tienda.', welcomeForm),
    section('WhatsApp e Instagram', null, socialForm),
    section('Video de portada', 'MP4 o WebM, máximo 40 MB. Se guarda al terminar de subir.', vidBox, prog, h('div', { class: 'x-field' }, h('span', { text: heroVideo ? 'Reemplazar video' : 'Subir video' }), vFile), vNote, rmBtn),
    section('Lookbook “En terreno”', 'Si está vacío, la tienda muestra las 4 fotos de ejemplo.', lbForm),
    section('Packs', 'Productos que se venden juntos con descuento.', pkForm));
}

sb.auth.onAuthStateChange((ev) => {
  if (ev === 'SIGNED_OUT' && S.step === 'panel') { S.step = 'login'; S.notice = 'Tu sesión terminó. Vuelve a ingresar.'; render(); }
});
// cierre por inactividad (mfa o panel)
let lastActive = Date.now();
['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach((ev) => document.addEventListener(ev, () => { lastActive = Date.now(); }, { capture: true, passive: true }));
function checkIdle() {
  if (S.step === 'login' || Date.now() - lastActive < IDLE_MS) return;
  lastActive = Date.now();
  logout('Sesión cerrada por inactividad. Vuelve a ingresar.');
}
setInterval(checkIdle, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkIdle(); });

render();
})();

    <script>
// sandbox sin allow-forms: submit sintético
(function () {
  var FLAG = '__vkSynthSubmit';
  function isSubmitBtn(el) {
    if (!el || !el.tagName) return false;
    var t = el.tagName, type = (el.getAttribute('type') || '').toLowerCase();
    if (t === 'BUTTON') return !el.hasAttribute('type') || type === 'submit';
    return t === 'INPUT' && type === 'submit';
  }
  function fire(form, submitter) {
    if (!form) return;
    var skipValidation = form.noValidate || (submitter && submitter.formNoValidate);
    if (!skipValidation && form.reportValidity && !form.reportValidity()) return;
    form[FLAG] = true;
    setTimeout(function () { form[FLAG] = false; }, 50);
    form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
  }
  document.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('button, input[type=submit]') : null;
    if (!isSubmitBtn(btn) || !btn.form || btn.disabled) return;
    e.preventDefault();
    fire(btn.form, btn);
  }, true);
  var NO_IMPLICIT = { button: 1, submit: 1, reset: 1, image: 1, file: 1, color: 1, range: 1, checkbox: 1, radio: 1 };
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.defaultPrevented || e.isComposing || e.altKey || e.ctrlKey || e.metaKey) return;
    var el = e.target;
    if (!el || el.tagName !== 'INPUT' || !el.form || NO_IMPLICIT[(el.type || '').toLowerCase()]) return;
    e.preventDefault();
    var form = el.form, def = null;
    for (var i = 0; i < form.elements.length; i++) { if (isSubmitBtn(form.elements[i])) { def = form.elements[i]; break; } }
    if (def) { if (!def.disabled) def.click(); }
    else fire(form, null);
  });
  document.addEventListener('submit', function (e) {
    var form = e.target;
    if (e.isTrusted && form && form[FLAG]) { e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);
  if (window.HTMLFormElement) {
    HTMLFormElement.prototype.requestSubmit = function (submitter) { fire(this, submitter || null); };
  }
})();
