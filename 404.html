<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Volkarra</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#C8541F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F5F0E6;--ink:#0E0E0E;--orange:#C8541F;--orange-dark:#A8441A;--muted:#5b574f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:Geist,system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
  main{max-width:520px;width:100%}
  .seal{width:150px;height:150px;margin:0 auto 28px;display:block;border-radius:50%}
  .code{font-family:"Geist Mono",monospace;font-size:13px;letter-spacing:.18em;color:var(--orange);text-transform:uppercase;margin-bottom:14px}
  h1{font-size:clamp(28px,6vw,40px);font-weight:600;line-height:1.1;letter-spacing:-.02em;margin-bottom:14px}
  p{font-size:17px;line-height:1.55;color:var(--muted);margin-bottom:30px}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;padding:14px 26px;border-radius:999px;font-weight:500;font-size:15px;text-decoration:none;transition:transform .15s,background .15s}
  a.primary{background:var(--orange);color:#fff}
  a.primary:hover{background:var(--orange-dark);transform:translateY(-1px)}
  a.ghost{border:1.5px solid var(--ink);color:var(--ink)}
  a.ghost:hover{background:var(--ink);color:var(--paper)}
  footer{margin-top:44px;font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
</style>
</head>
<body>
<main>
  <img class="seal" src="/logo-sello.png" alt="Volkarra · La Araucanía · Chile" width="150" height="150">
  <div class="code">Error 404 · Sendero perdido</div>
  <h1>Este camino no lleva a ninguna parte</h1>
  <p>La página que buscas no existe o cambió de lugar. Vuelve al inicio y sigue explorando la colección Volkarra.</p>
  <div class="actions">
    <a class="btn primary" href="/">Volver a la tienda</a>
    <a class="btn ghost" href="https://www.instagram.com/volkarra.outdoor/" target="_blank" rel="noopener">Instagram</a>
  </div>
  <footer>Volkarra · Nacida en La Araucanía</footer>
</main>
</body>
</html>
